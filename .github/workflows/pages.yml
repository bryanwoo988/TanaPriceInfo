name: Publish PWA + API

on:
  # When the app or the build script changes.
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  # Started by the daily price run after it saves new data (and by hand).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # newest data, including the commit the price run just pushed
          fetch-depth: 0  # full history: release dates in the changelog come from git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: python scripts/build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # deploy-pages sometimes looks for the artifact before GitHub has registered
      # it ("No artifacts named github-pages"); wait and try once more.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
